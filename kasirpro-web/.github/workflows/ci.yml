name: KasirPro Web CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kasirpro-web/package-lock.json

      - name: Install
        working-directory: kasirpro-web
        run: npm ci

      - name: Type check
        working-directory: kasirpro-web
        run: npx tsc --noEmit

      - name: Build
        working-directory: kasirpro-web
        run: npm run build
        env:
          VITE_API_URL: https://api.kasirpro.example.com/api/v1
